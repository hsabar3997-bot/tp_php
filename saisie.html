<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes (POST)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        div { margin-bottom: 12px; }
        label { display: inline-block; width: 140px; }
    </style>
</head>
<body>
    <h2>Saisie des notes d'un apprenant (Méthode POST)</h2>
    <form action="traitement.php" method="POST">
        <div>
            <label for="nom">Nom de l'apprenant :</label>
            <input type="text" id="nom" name="nom" required>
        </div>
        <div>
            <label for="note_info">Note Informatique :</label>
            <input type="number" step="0.5" id="note_info" name="note_info" required>
        </div>
        <div>
            <label for="note_math">Note Mathématiques :</label>
            <input type="number" step="0.5" id="note_math" name="note_math" required>
        </div>
        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
