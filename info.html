<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire d'information (GET)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        div { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Formulaire d'identification (Méthode GET)</h2>
    <form action="info.php" method="GET">
        <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
        </div>
        <div>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" required>
        </div>
        <div>
            <label>Sexe :</label>
            <input type="radio" id="homme" name="sexe" value="M" checked> <label for="homme">M</label>
            <input type="radio" id="femme" name="sexe" value="F"> <label for="femme">F</label>
        </div>
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
